version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # Routine patch/minor bumps for the framework and tooling stay together so
      # a React or Vite bump is reviewable as one change.
      dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # Deliberate majors (React 19, Vite 7, mdui 2) get their own pull
      # request, since they can require source changes.
      major-updates:
        update-types:
          - major
    # typescript-eslint 8.x peer-supports only `>=4.8.4 <6.1.0`; a TS major
    # bump (e.g. 7.x) breaks `npm ci` in CI until the toolchain catches up.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'